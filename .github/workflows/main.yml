name: Auto IPTV Update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Run script
        run: node index.js

      - name: Push file
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add static.m3u
          git commit -m "auto update" || echo "no change"
          git push
